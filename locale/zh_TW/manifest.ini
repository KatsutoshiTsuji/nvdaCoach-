summary = "NVDA Coach - 互動式螢幕閱讀器訓練"
description = """
NVDA Coach 是一款面向 NVDA 螢幕閱讀器的互動式訓練外掛。
它透過簡短的實踐練習幫助你掌握 NVDA 命令。
你無需閱讀手冊，而是在語音回饋的引導下進行實時練習。
本外掛專為初學者以及剛開始接觸螢幕閱讀器的人設計。
要開始使用，請按 NVDA+Shift+C。
教練視窗將會開啟，其中包含課程介紹和課程列表。
用方向鍵選擇一課，然後按 Enter。
每節課由一系列步驟組成。
對於需要執行命令的步驟，請切換到其他視窗，完成操作後按 NVDA+Shift+C 返回教練視窗。
對於包含內建文字的步驟，可直接在教練視窗中練習。
課程進行期間，以下按鍵始終可用：
• Enter——進入下一步
• F1——重複當前指令
• F2——獲取當前步驟的提示
• F3——跳過當前步驟
• Escape——停止課程
完成一課後，按 Ctrl+N 進入下一課，按 Ctrl+B 返回上一課，按 Ctrl+R 重新開始本課。
外掛會記住已完成的課程，並在列表中加以標記。
學習進度儲存在 NVDA 的配置資料夾中。
NVDA Coach 目前包含六章：
• 《NVDA 入門》
• 《閱讀和瀏覽文字》
• 《瀏覽模式與網頁導航》
• 《物件導航》
• 《自訂 NVDA》
• 《認識你的鍵盤》
課程包含內建練習環境：
• 實時練習表單，用於練習 Tab 導航和控制元件操作
• 文字區域，可直接在教練視窗中練習閱讀和選擇文字
• 獨立的練習網頁，用於練習按標題、連結和表單導航
本外掛由輔助技術講師 Tony Gebhard 開發。
"""
